# Tests
# =====
#
# Runs the pytest suite on every push to main and on every pull request.
#
# What it covers: the unit tests (poller parsing and diffing, and the Spark
# parsing logic on a small local Spark session).
# What it does not cover: Kafka and Postgres. There is no integration job,
# the full pipeline is checked with scripts/smoke_test.sh on a real stack.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The spark tests start a small local spark session, which needs java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v
